name: Extension CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node scripts/verify-js.js
      - name: Verify release consistency
        run: node scripts/verify-release.js
      - name: Run tests
        run: node --test tests/*.test.js
